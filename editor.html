<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>縦書きエディタ</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, "Segoe UI", sans-serif;
      background: #f3f4f6;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    /* ── テキストエリア ── */
    #input-area {
      flex: 0 0 auto;
      padding: 8px 12px;
      background: #fff;
      border-bottom: 1px solid #d1d5db;
    }
    #input-area label {
      display: block;
      font-size: 11px;
      color: #6b7280;
      margin-bottom: 4px;
    }
    #editor {
      width: 100%;
      height: 120px;
      resize: vertical;
      font-family: "Menlo", "Monaco", "Consolas", monospace;
      font-size: 13px;
      line-height: 1.6;
      border: 1px solid #d1d5db;
      border-radius: 4px;
      padding: 6px 8px;
      outline: none;
      background: #fafafa;
      color: #1f2328;
    }
    #editor:focus { border-color: #3b82d4; background: #fff; }

    /* ── ツールバー ── */
    #toolbar {
      flex: 0 0 auto;
      height: 36px;
      background: #f9fafb;
      border-bottom: 1px solid #d1d5db;
      display: flex;
      align-items: center;
      padding: 0 12px;
      gap: 8px;
    }
    #toolbar span {
      font-size: 11px;
      color: #9ca3af;
      user-select: none;
    }

    /* ── プレビュー ── */
    #preview-area {
      flex: 1 1 0;
      overflow: auto;
      background: #e5e7eb;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 16px;
    }
    #preview {
      display: block;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0,0,0,.12);
    }

    /* ── エラー表示 ── */
    #error-bar {
      display: none;
      position: fixed;
      bottom: 0; left: 0; right: 0;
      background: #fef2f2;
      border-top: 1px solid #fca5a5;
      color: #b91c1c;
      font-size: 12px;
      padding: 4px 12px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <div id="input-area">
    <label>入力テキスト（記法: &lt;書&gt;[か]き &lt;取&gt;[と]り枠、{漢字}[読み]、など）</label>
    <textarea id="editor" spellcheck="false"></textarea>
  </div>

  <div id="toolbar">
    <span>ツールバー（将来拡張予定）</span>
  </div>

  <div id="preview-area">
    <canvas id="preview"></canvas>
  </div>

  <div id="error-bar"></div>

  <script type="module">
    import { Tategaki } from './dist/browser/tategaki.js';

    const DPR        = 2; // 物理解像度を2倍（高DPI対応）
    const FONT_SIZE  = 15 * DPR;
    const FONT       = `${FONT_SIZE}px "游教科書体"`;
    const CANVAS_CSS_HEIGHT = 600;
    const MARGIN_V   = 40 * DPR;  // 上下余白
    const MARGIN_H   = 50 * DPR;  // 左右余白

    const textarea  = document.getElementById('editor');
    const canvas    = document.getElementById('preview');
    const errorBar  = document.getElementById('error-bar');
    const ctx       = canvas.getContext('2d');

    textarea.value = '② {今日}[[きょう]]は<学>[がっ]<校>[こう]で{{魚釣り}}[さかなつり]実習があるぞ。';

    function getLines() {
      return textarea.value.split('\n').filter(l => l.trim() !== '');
    }

    function draw() {
      const lines = getLines();
      errorBar.style.display = 'none';

      // CSS サイズ（表示サイズ）を設定
      const cssWidth = Math.max(canvas.parentElement.clientWidth - 32, 200);
      canvas.style.width  = cssWidth + 'px';
      canvas.style.height = CANVAS_CSS_HEIGHT + 'px';

      // 物理ピクセルサイズを DPR 倍に設定
      canvas.width  = cssWidth * DPR;
      canvas.height = CANVAS_CSS_HEIGHT * DPR;

      // 背景
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (lines.length === 0) return;

      try {
        const tategaki = new Tategaki(ctx, { font: FONT, lineHeight: 1.0 });
        // 各列の幅を計測してブロック全体の幅を算出し、Canvas 中央に配置
        const colStep = FONT_SIZE * 5; // columnGap デフォルト 5
        const blockWidth = (lines.length - 1) * colStep
          + lines.reduce((max, l) => Math.max(max, tategaki.measureText(l).width), 0);
        const startX = Math.round(canvas.width / 2 + blockWidth / 2);
        tategaki.fillTextBlock(lines, startX, MARGIN_V);
      } catch (e) {
        errorBar.textContent = String(e);
        errorBar.style.display = 'block';
      }
    }

    // テキスト変更時に再描画
    textarea.addEventListener('input', draw);

    // ResizeObserver で preview-area リサイズ時に再描画
    new ResizeObserver(draw).observe(canvas.parentElement);

    // 初回描画
    draw();
  </script>
</body>
</html>
