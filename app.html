<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>漢字テスト作成</title>
<script type="importmap">
{
  "imports": {
    "pdf-lib": "./dist/browser/pdf-lib.esm.min.js"
  }
}
</script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, "Segoe UI", sans-serif;
    background: #f3f4f6;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
    color: #1f2328;
  }

  /* ── タブ ── */
  #tabs {
    flex: 0 0 auto;
    display: flex;
    background: #1f2937;
    border-bottom: 1px solid #111827;
  }
  #tabs button {
    flex: 0 0 auto;
    padding: 10px 20px;
    background: none;
    border: none;
    color: #9ca3af;
    font-size: 14px;
    cursor: pointer;
  }
  #tabs button.active {
    color: #fff;
    background: #374151;
    border-bottom: 2px solid #3b82d4;
  }

  #tab-content {
    flex: 1 1 0;
    overflow: hidden;
    display: flex;
  }
  .tab-panel {
    flex: 1 1 0;
    display: none;
    overflow: hidden;
    min-width: 0;
  }
  .tab-panel.active { display: flex; }

  button {
    font-family: inherit;
  }
  .btn {
    padding: 6px 14px;
    font-size: 13px;
    border: 1px solid #d1d5db;
    border-radius: 4px;
    background: #fff;
    color: #1f2328;
    cursor: pointer;
  }
  .btn:hover { background: #f3f4f6; }
  .btn:disabled { color: #9ca3af; cursor: default; background: #f3f4f6; }
  .btn-primary {
    background: #3b82d4;
    border-color: #3b82d4;
    color: #fff;
  }
  .btn-primary:hover { background: #2f6cb3; }
  .btn-danger {
    color: #b91c1c;
    border-color: #fca5a5;
  }
  .btn-danger:hover { background: #fef2f2; }

  /* ── 問題管理タブ ── */
  #tab-questions { }
  .q-list-pane {
    flex: 0 0 280px;
    border-right: 1px solid #d1d5db;
    background: #fff;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .q-list-header {
    flex: 0 0 auto;
    padding: 8px 12px;
    border-bottom: 1px solid #e5e7eb;
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    color: #6b7280;
  }
  #q-list {
    flex: 1 1 0;
    overflow-y: auto;
    list-style: none;
    outline: none;
  }
  #q-list li {
    padding: 8px 12px;
    border-bottom: 1px solid #f3f4f6;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  #q-list li .q-label {
    flex: 1 1 auto;
    min-width: 0;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #q-list li .badge {
    flex: 0 0 auto;
    font-size: 10px;
    color: #6b7280;
    background: #f3f4f6;
    border-radius: 3px;
    padding: 1px 4px;
  }
  #q-list li .badge.kind-badge {
    color: #4338ca;
    background: #eef2ff;
  }
  #q-list li .badge.grade-badge {
    color: #065f46;
    background: #d1fae5;
  }
  #q-list li .badge.grade-badge.grade-unknown {
    color: #9ca3af;
    background: #f3f4f6;
  }
  #q-list li:hover { background: #f9fafb; }
  #q-list li.selected { background: #dbeafe; }
  #q-list:focus li.selected { background: #bfdbfe; outline: 1px solid #3b82d4; }
  #q-list .q-empty {
    padding: 16px 12px;
    color: #9ca3af;
    font-size: 12px;
    cursor: default;
  }

  .q-edit-pane {
    flex: 1 1 0;
    display: flex;
    flex-direction: row;
    min-width: 0;
    padding: 12px;
    gap: 12px;
  }
  .q-edit-form {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    min-width: 0;
    gap: 8px;
  }
  .q-edit-form label {
    font-size: 11px;
    color: #6b7280;
  }
  #q-editor {
    width: 100%;
    height: 90px;
    resize: vertical;
    font-family: "Menlo", "Monaco", "Consolas", monospace;
    font-size: 13px;
    line-height: 1.6;
    border: 1px solid #d1d5db;
    border-radius: 4px;
    padding: 6px 8px;
    outline: none;
    background: #fafafa;
  }
  #q-editor:focus { border-color: #3b82d4; background: #fff; }

  .q-form-row {
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    font-size: 13px;
  }
  .q-form-row .spacer { flex: 1 1 auto; }

  .q-furigana-toolbar {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .q-furigana-toolbar .btn { padding: 6px 10px; font-size: 12px; display: inline-flex; align-items: center; gap: 7px; }
  .q-furigana-toolbar .ficon { width: 30px; height: 30px; flex-shrink: 0; }
  .q-furigana-status { font-size: 11px; color: #9ca3af; }

  #q-error-bar {
    display: none;
    font-size: 12px;
    color: #b91c1c;
    background: #fef2f2;
    border: 1px solid #fca5a5;
    border-radius: 4px;
    padding: 4px 8px;
    white-space: pre-wrap;
  }

  .q-preview-wrap {
    flex: 0 0 240px;
    overflow: auto;
    background: #e5e7eb;
    border-radius: 4px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 12px;
  }
  #q-preview {
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
  }

  /* ── 漢字範囲管理タブ ── */
  #tab-kanji {
    flex-direction: column;
    padding: 16px;
    gap: 12px;
    overflow-y: auto;
  }
  .k-header {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 14px;
  }
  .k-header select {
    font-size: 14px;
    padding: 4px 6px;
  }
  .k-hint {
    font-size: 12px;
    color: #6b7280;
  }
  .k-grade-block {
    background: #fff;
    border: 1px solid #e5e7eb;
    border-radius: 6px;
    padding: 10px 12px;
  }
  .k-grade-title {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 8px;
    color: #374151;
  }
  .k-chars {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
  }
  .k-char {
    width: 32px;
    height: 32px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    border: 1px solid #d1d5db;
    border-radius: 4px;
    background: #fff;
    cursor: pointer;
    user-select: none;
  }
  .k-char.learned {
    background: #dbeafe;
    border-color: #93c5fd;
    color: #1e40af;
  }
  .k-char.locked-past {
    background: #f3f4f6;
    border-color: #e5e7eb;
    color: #9ca3af;
    cursor: default;
  }
  .k-char.locked-future {
    background: #fff;
    border-color: #f3f4f6;
    color: #d1d5db;
    cursor: default;
  }

  /* ── テスト生成タブ ── */
  #tab-test {
    flex-direction: row;
    padding: 16px;
    gap: 16px;
    overflow: hidden;
  }
  .t-controls {
    flex: 0 0 200px;
    display: flex;
    flex-direction: column;
    align-items: stretch;
    gap: 14px;
    font-size: 13px;
    overflow-y: auto;
  }
  .t-controls label { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .t-controls input[type="number"] {
    width: 100%;
    padding: 4px 6px;
    font-size: 13px;
    box-sizing: border-box;
  }
  .t-main {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    min-width: 0;
    overflow: hidden;
  }
  #t-warnings {
    flex: 0 0 auto;
    font-size: 12px;
    color: #92400e;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 4px;
    padding: 6px 8px;
    display: none;
    white-space: pre-wrap;
  }
  #t-preview-wrap {
    flex: 1 1 0;
    overflow: auto;
    background: #e5e7eb;
    border-radius: 4px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 16px;
  }
  #t-preview {
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
  }
  #t-empty {
    color: #9ca3af;
    font-size: 13px;
    padding: 32px;
  }

  /* ── 履歴確認タブ ── */
  #tab-history { }
  .h-list-pane {
    flex: 0 0 280px;
    border-right: 1px solid #d1d5db;
    background: #fff;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  .h-list-header {
    flex: 0 0 auto;
    padding: 8px 12px;
    border-bottom: 1px solid #e5e7eb;
    font-size: 12px;
    color: #6b7280;
  }
  #h-list {
    flex: 1 1 0;
    overflow-y: auto;
    list-style: none;
  }
  #h-list li {
    padding: 8px 12px;
    border-bottom: 1px solid #f3f4f6;
    cursor: pointer;
    font-size: 13px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  #h-list li .h-label {
    flex: 1 1 auto;
    min-width: 0;
  }
  #h-list li .h-count {
    display: block;
    font-size: 11px;
    color: #6b7280;
  }
  #h-list li .h-delete-btn {
    flex: 0 0 auto;
    font-size: 11px;
    padding: 2px 6px;
  }
  #h-list li:hover { background: #f9fafb; }
  #h-list li.selected { background: #dbeafe; }
  #h-list .h-empty {
    padding: 16px 12px;
    color: #9ca3af;
    font-size: 12px;
    cursor: default;
  }
  .h-preview-pane {
    flex: 1 1 0;
    display: flex;
    flex-direction: column;
    min-width: 0;
    padding: 12px;
    gap: 8px;
  }
  .h-detail-controls {
    flex: 0 0 auto;
  }
  #h-warnings {
    flex: 0 0 auto;
    font-size: 12px;
    color: #92400e;
    background: #fffbeb;
    border: 1px solid #fde68a;
    border-radius: 4px;
    padding: 6px 8px;
    display: none;
    white-space: pre-wrap;
  }
  #h-preview-wrap {
    flex: 1 1 0;
    overflow: auto;
    background: #e5e7eb;
    border-radius: 4px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 16px;
  }
  #h-preview {
    background: #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,.12);
  }
  #h-empty {
    color: #9ca3af;
    font-size: 13px;
    padding: 32px;
  }
</style>
</head>
<body>

<div id="tabs">
  <button data-tab="questions" class="active">問題管理</button>
  <button data-tab="kanji">漢字範囲管理</button>
  <button data-tab="test">テスト生成・印刷</button>
  <button data-tab="history">履歴確認</button>
</div>

<div id="tab-content">

  <!-- ── 問題管理 ── -->
  <div id="tab-questions" class="tab-panel active">
    <div class="q-list-pane">
      <div class="q-list-header">
        <span>登録済み問題(<span id="q-count">0</span>件)</span>
        <button class="btn" id="q-new-btn">新規 (Esc)</button>
      </div>
      <ul id="q-list" tabindex="0"></ul>
    </div>
    <div class="q-edit-pane">
      <div class="q-edit-form">
        <label for="q-editor">記法テキスト(1問=1行)</label>
        <div class="q-furigana-toolbar" id="q-furigana-toolbar">
          <button class="btn" id="q-furi-ruby" disabled title="選択範囲の漢字にふりがなを振る">
            <svg class="ficon" viewBox="0 0 20 20" aria-hidden="true">
              <text x="7" y="16" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">字</text>
              <text x="16" y="14" font-size="6" text-anchor="middle" fill="currentColor">あ</text>
            </svg>
            <span class="ficon-label">ふりがな</span>
          </button>
          <button class="btn" id="q-furi-read" disabled title="漢字はそのまま表示し、読みを書く空欄にする">
            <svg class="ficon" viewBox="0 0 20 20" aria-hidden="true">
              <text x="5" y="16" font-size="12" font-weight="600" text-anchor="middle" fill="currentColor">字</text>
              <path d="M12 5 L12 7.5 M12 5 L17 5 M17 5 L17 7.5 M12 15 L12 12.5 M12 15 L17 15 M17 15 L17 12.5"
                    fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
            </svg>
            <span class="ficon-label">読みを問題に</span>
          </button>
          <button class="btn" id="q-furi-write" disabled title="漢字を空欄にし、読みを添えて漢字を書かせる">
            <svg class="ficon" viewBox="0 0 20 20" aria-hidden="true">
              <rect x="2" y="5" width="11" height="11" rx="1" fill="none" stroke="currentColor" stroke-width="1.3"/>
              <path d="M7.5 5 L7.5 16 M2 10.5 L13 10.5" stroke="currentColor" stroke-width="0.6" stroke-dasharray="1.2,1.2" opacity="0.55"/>
              <text x="16" y="14" font-size="6" text-anchor="middle" fill="currentColor">あ</text>
            </svg>
            <span class="ficon-label">漢字を問題に</span>
          </button>
          <button class="btn" id="q-furi-bracket" disabled title="送り仮名を含む語をまとめて空欄にし、読みを添えて書かせる">
            <svg class="ficon" viewBox="0 0 20 20" aria-hidden="true">
              <path d="M3 4 L3 7.5 M3 4 L9 4 M9 4 L9 7.5 M3 16 L3 12.5 M3 16 L9 16 M9 16 L9 12.5"
                    fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
              <text x="15" y="8" font-size="6" text-anchor="middle" fill="currentColor">か</text>
              <text x="15" y="15" font-size="6" text-anchor="middle" fill="currentColor">く</text>
            </svg>
            <span class="ficon-label">漢字+送り仮名</span>
          </button>
          <span class="q-furigana-status" id="q-furigana-status">読み込み中…</span>
        </div>
        <textarea id="q-editor" spellcheck="false" placeholder="例: 明日[あした]は &lt;遠&gt;[えん]足[そく]です。"></textarea>
        <div class="q-form-row">
          <label><input type="radio" name="q-weight" value="1" checked> 通常(1問分)</label>
          <label><input type="radio" name="q-weight" value="2"> 長め(2問分・1列を単独で使う)</label>
          <span class="spacer"></span>
          <button class="btn btn-primary" id="q-save-btn">保存</button>
          <button class="btn btn-danger" id="q-delete-btn" disabled>削除</button>
        </div>
        <div id="q-error-bar"></div>
      </div>
      <div class="q-preview-wrap">
        <canvas id="q-preview"></canvas>
      </div>
    </div>
  </div>

  <!-- ── 漢字範囲管理 ── -->
  <div id="tab-kanji" class="tab-panel">
    <div class="k-header">
      <label>現在の学年:
        <select id="k-grade">
          <option value="1">1年</option>
          <option value="2">2年</option>
          <option value="3">3年</option>
          <option value="4">4年</option>
          <option value="5">5年</option>
          <option value="6">6年</option>
        </select>
      </label>
      <button class="btn" id="k-advance-btn">学年を進める(年度更新時に1回だけ)</button>
    </div>
    <p class="k-hint">
      下の学年の漢字はすべて既習として扱われます。現学年の枠内で、これまでに習った漢字をクリックして登録してください
      (もう一度クリックすると取り消せます)。
    </p>
    <div id="k-grade-lists"></div>
  </div>

  <!-- ── テスト生成・印刷 ── -->
  <div id="tab-test" class="tab-panel">
    <div class="t-controls">
      <label>下位学年の復習割合:
        <input type="number" id="t-review-ratio" min="0" max="1" step="0.1">
      </label>
      <label>読み問題の割合:
        <input type="number" id="t-read-ratio" min="0" max="1" step="0.1">
      </label>
      <label>送り仮名問題の割合:
        <input type="number" id="t-okurigana-ratio" min="0" max="1" step="0.1">
      </label>
      <label>直近何回分を重複判定に使うか:
        <input type="number" id="t-history-count" min="1" step="1">
      </label>
      <button class="btn btn-primary" id="t-generate-btn">テストを生成</button>
      <button class="btn" id="t-pdf-btn" disabled>PDFを開く(印刷用)</button>
    </div>
    <div class="t-main">
      <div id="t-warnings"></div>
      <div id="t-preview-wrap">
        <div id="t-empty">「テストを生成」を押すとここにプレビューが表示されます。</div>
        <canvas id="t-preview" style="display:none"></canvas>
      </div>
    </div>
  </div>

  <!-- ── 履歴確認 ── -->
  <div id="tab-history" class="tab-panel">
    <div class="h-list-pane">
      <div class="h-list-header">テスト履歴(<span id="h-count">0</span>件)</div>
      <ul id="h-list"></ul>
    </div>
    <div class="h-preview-pane">
      <div class="h-detail-controls" id="h-detail-controls" style="display:none">
        <button class="btn" id="h-reprint-btn">この回をもう一度印刷する</button>
      </div>
      <div id="h-warnings"></div>
      <div id="h-empty">左の一覧からテストを選ぶと、解答（赤字）がここに表示されます。</div>
      <div id="h-preview-wrap" style="display:none">
        <canvas id="h-preview"></canvas>
      </div>
    </div>
  </div>

</div>

<script src="./dist/browser/kuromoji.js"></script>
<script type="module">
  import { Tategaki } from './dist/browser/tategaki.js';
  import {
    listQuestions, saveQuestion, deleteQuestion, plainText, getQuestion, questionKinds, questionGrade,
  } from './dist/browser/questionStore.js';
  import { GRADE_KANJI } from './dist/browser/kanjiData.js';
  import {
    loadLearnedKanjiState, addLearnedKanji, removeLearnedKanji,
    advanceGrade, setCurrentGrade, computeLearnedKanjiSet,
  } from './dist/browser/learnedKanjiStore.js';
  import { loadSettings, saveSettings } from './dist/browser/settingsStore.js';
  import {
    recordTest, countRecentUses, loadHistory, formatTestLabel, deleteHistoryEntry,
  } from './dist/browser/testHistoryStore.js';
  import { selectQuestions, assignColumns } from './dist/browser/testGenerator.js';
  import { renderPageToCanvas, generateTestPdf, openPdfInNewTab } from './dist/browser/pdfExport.js';
  import { initFurigana, buildRuby, buildReadBox, buildWriteBox, buildBracketBox } from './dist/browser/furigana.js';

  const DPR = 2;
  const FONT_NAME = '游教科書体';
  const isMac = /Mac|iPhone|iPad/.test(navigator.platform ?? navigator.userAgent);
  const KIND_LABELS = { write: '書', read: '読', okurigana: '送' };
  function questionKindLabel(text) {
    return questionKinds(text).map(k => KIND_LABELS[k]).join('+');
  }

  // ─────────────────────────────────────────────
  // タブ切り替え
  // ─────────────────────────────────────────────
  const tabButtons = document.querySelectorAll('#tabs button');
  const tabPanels = {
    questions: document.getElementById('tab-questions'),
    kanji: document.getElementById('tab-kanji'),
    test: document.getElementById('tab-test'),
    history: document.getElementById('tab-history'),
  };
  tabButtons.forEach(btn => {
    btn.addEventListener('click', () => {
      tabButtons.forEach(b => b.classList.remove('active'));
      Object.values(tabPanels).forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      tabPanels[btn.dataset.tab].classList.add('active');
      if (btn.dataset.tab === 'kanji') renderKanjiTab();
      if (btn.dataset.tab === 'test') renderTestControls();
      if (btn.dataset.tab === 'history') renderHistoryList();
    });
  });

  // ─────────────────────────────────────────────
  // 問題管理タブ
  // ─────────────────────────────────────────────
  const qList = document.getElementById('q-list');
  const qCount = document.getElementById('q-count');
  const qEditor = document.getElementById('q-editor');
  const qSaveBtn = document.getElementById('q-save-btn');
  const qDeleteBtn = document.getElementById('q-delete-btn');
  const qNewBtn = document.getElementById('q-new-btn');
  const qErrorBar = document.getElementById('q-error-bar');
  const qPreview = document.getElementById('q-preview');
  const qPreviewCtx = qPreview.getContext('2d');

  // ショートカットキーの表示はOSごとに変える(Mac: ⌘、その他: Ctrl)。
  qSaveBtn.textContent = `保存 (${isMac ? '⌘Enter' : 'Ctrl+Enter'})`;
  qDeleteBtn.textContent = `削除 (${isMac ? '⌘⌫' : 'Ctrl+⌫'})`;

  let questions = [];
  let editingId = null; // null = 新規作成モード
  let selectedIndex = -1;

  function refreshQuestionList() {
    questions = listQuestions();
    qCount.textContent = String(questions.length);
    qList.innerHTML = '';
    if (questions.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'q-empty';
      empty.textContent = '問題がまだありません。右側で新規作成してください。';
      qList.appendChild(empty);
      return;
    }
    questions.forEach((q, i) => {
      const li = document.createElement('li');
      li.dataset.id = q.id;
      const label = document.createElement('span');
      label.className = 'q-label';
      label.textContent = plainText(q.text) || '(空)';
      li.appendChild(label);
      const kindLabel = questionKindLabel(q.text);
      if (kindLabel) {
        const kindBadge = document.createElement('span');
        kindBadge.className = 'badge kind-badge';
        kindBadge.textContent = kindLabel;
        li.appendChild(kindBadge);
      }
      const grade = questionGrade(q.text);
      const gradeBadge = document.createElement('span');
      gradeBadge.className = 'badge grade-badge' + (grade ? '' : ' grade-unknown');
      gradeBadge.textContent = grade ? `${grade}年` : '―';
      gradeBadge.title = grade
        ? `${grade}年生で習う漢字を含む問題`
        : '学年配当漢字を含まないため学年を判定できません';
      li.appendChild(gradeBadge);
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = q.weight === 2 ? '長め' : '通常';
      li.appendChild(badge);
      if (i === selectedIndex) li.classList.add('selected');
      li.addEventListener('click', () => {
        selectedIndex = i;
        loadIntoEditor(q);
        highlightSelected();
      });
      qList.appendChild(li);
    });
  }

  function highlightSelected() {
    [...qList.children].forEach((li, i) => li.classList.toggle('selected', i === selectedIndex));
  }

  function loadIntoEditor(q) {
    editingId = q.id;
    qEditor.value = q.text;
    document.querySelector(`input[name="q-weight"][value="${q.weight}"]`).checked = true;
    qDeleteBtn.disabled = false;
    drawQuestionPreview();
    qEditor.focus();
  }

  function startNew() {
    editingId = null;
    selectedIndex = -1;
    qEditor.value = '';
    document.querySelector('input[name="q-weight"][value="1"]').checked = true;
    qDeleteBtn.disabled = true;
    highlightSelected();
    drawQuestionPreview();
    qEditor.focus();
  }

  function currentWeight() {
    return Number(document.querySelector('input[name="q-weight"]:checked').value);
  }

  function drawQuestionPreview() {
    const text = qEditor.value.trim();
    qErrorBar.style.display = 'none';

    // 縦書きは1問=1列なので、幅はサイドバー幅で足りるが、高さは問題文の長さに応じて伸びる。
    // measureText には ctx.font が必要 → canvas の width/height を書き換えるとcontext状態が
    // リセットされるため、リサイズ前に測定し、リサイズ後に Tategaki を作り直す。
    const fontSize = 17 * DPR;
    const marginV = 20 * DPR;
    const wrapWidth = qPreview.parentElement.clientWidth - 24;
    const wrapHeight = qPreview.parentElement.clientHeight - 24;

    let textWidth = 0;
    let textHeight = 0;
    let measureError = null;
    if (text) {
      try {
        const measured = new Tategaki(qPreviewCtx, { font: `${fontSize}px "${FONT_NAME}"`, lineHeight: 1.0 }).measureText(text);
        textWidth = measured.width;
        textHeight = measured.height;
      } catch (e) {
        measureError = e;
      }
    }

    const cssWidth = Math.max(wrapWidth, Math.ceil(textWidth / DPR) + 40, 150);
    const cssHeight = Math.max(wrapHeight, Math.ceil(textHeight / DPR) + Math.ceil((marginV * 2) / DPR), 200);
    qPreview.style.width = cssWidth + 'px';
    qPreview.style.height = cssHeight + 'px';
    qPreview.width = cssWidth * DPR;
    qPreview.height = cssHeight * DPR;

    const tategaki = new Tategaki(qPreviewCtx, { font: `${fontSize}px "${FONT_NAME}"`, lineHeight: 1.0 });
    qPreviewCtx.fillStyle = '#ffffff';
    qPreviewCtx.fillRect(0, 0, qPreview.width, qPreview.height);
    if (!text) return;

    if (measureError) {
      qErrorBar.textContent = String(measureError);
      qErrorBar.style.display = 'block';
      return;
    }

    try {
      const startX = Math.round(qPreview.width / 2 + tategaki.measureText(text).width / 2);
      tategaki.fillText(text, startX, marginV);
    } catch (e) {
      qErrorBar.textContent = String(e);
      qErrorBar.style.display = 'block';
    }
  }

  function saveCurrent() {
    const text = qEditor.value.trim();
    if (!text) return;
    const saved = saveQuestion({ id: editingId ?? undefined, text, weight: currentWeight() });
    editingId = saved.id;
    qDeleteBtn.disabled = false;
    refreshQuestionList();
    selectedIndex = questions.findIndex(q => q.id === saved.id);
    highlightSelected();
  }

  function deleteCurrent() {
    if (!editingId) return;
    if (!confirm('この問題を削除しますか？')) return;
    deleteQuestion(editingId);
    startNew();
    refreshQuestionList();
  }

  qEditor.addEventListener('input', drawQuestionPreview);
  new ResizeObserver(drawQuestionPreview).observe(qPreview.parentElement);

  qEditor.addEventListener('keydown', e => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
      e.preventDefault();
      saveCurrent();
    } else if ((e.metaKey || e.ctrlKey) && e.key === 'Backspace') {
      e.preventDefault();
      deleteCurrent();
    } else if (e.key === 'Escape') {
      e.preventDefault();
      startNew();
    } else if (e.ctrlKey && e.shiftKey && e.code === 'KeyU') {
      e.preventDefault();
      applyFurigana(buildRuby);
    } else if (e.ctrlKey && e.shiftKey && e.code === 'KeyI') {
      e.preventDefault();
      applyFurigana(buildReadBox);
    } else if (e.ctrlKey && e.shiftKey && e.code === 'KeyO') {
      e.preventDefault();
      applyFurigana(buildWriteBox);
    } else if (e.ctrlKey && e.shiftKey && e.code === 'KeyP') {
      e.preventDefault();
      applyFurigana(buildBracketBox);
    }
  });

  // ─────────────────────────────────────────────
  // ふりがな入力補助ツールバー(kuromoji + 教育漢字読みデータでオフライン変換)
  // ─────────────────────────────────────────────
  const qFuriganaButtons = [
    document.getElementById('q-furi-ruby'),
    document.getElementById('q-furi-read'),
    document.getElementById('q-furi-write'),
    document.getElementById('q-furi-bracket'),
  ];
  const qFuriganaStatus = document.getElementById('q-furigana-status');
  let furiganaReady = false;

  // Cmd+Shift+数字はMacのスクリーンショット操作と衝突するため、ここではControlキーのみを使う。
  // 表示上のキー名はOSごとに変える(Mac: ⌃⇧、その他: Ctrl+Shift)。
  const FURIGANA_SHORTCUT_KEYS = ['U', 'I', 'O', 'P'];
  qFuriganaButtons.forEach((btn, i) => {
    const key = FURIGANA_SHORTCUT_KEYS[i];
    const hint = isMac ? `⌃⇧${key}` : `Ctrl+Shift+${key}`;
    const label = btn.querySelector('.ficon-label') ?? btn;
    label.textContent = `${label.textContent} (${hint})`;
  });

  function updateFuriganaToolbarState() {
    const hasSelection = qEditor.selectionStart !== qEditor.selectionEnd;
    qFuriganaButtons.forEach(btn => { btn.disabled = !furiganaReady || !hasSelection; });
  }

  initFurigana().then(() => {
    furiganaReady = true;
    qFuriganaStatus.textContent = '';
    updateFuriganaToolbarState();
  }).catch(err => {
    qFuriganaStatus.textContent = '読み込み失敗: ' + err;
  });

  ['select', 'mouseup', 'keyup', 'input'].forEach(evt => qEditor.addEventListener(evt, updateFuriganaToolbarState));

  async function applyFurigana(buildFn) {
    if (!furiganaReady) return;
    const start = qEditor.selectionStart;
    const end = qEditor.selectionEnd;
    if (start === end) return;
    const selected = qEditor.value.slice(start, end);
    let result;
    try {
      result = await buildFn(selected);
    } catch (err) {
      qErrorBar.textContent = String(err);
      qErrorBar.style.display = 'block';
      return;
    }
    qEditor.focus();
    qEditor.setSelectionRange(start, end);
    // execCommand('insertText')でネイティブのアンドゥ履歴に載せる。
    // qEditor.value を直接書き換えるとブラウザの元に戻す/やり直すが効かなくなるため。
    const inserted = document.execCommand('insertText', false, result.replacement);
    if (!inserted) {
      const before = qEditor.value.slice(0, start);
      const after = qEditor.value.slice(end);
      qEditor.value = before + result.replacement + after;
      drawQuestionPreview();
    }
    const caret = start + (result.caretOffset ?? result.replacement.length);
    qEditor.setSelectionRange(caret, caret);
    updateFuriganaToolbarState();
  }

  qFuriganaButtons[0].addEventListener('click', () => applyFurigana(buildRuby));
  qFuriganaButtons[1].addEventListener('click', () => applyFurigana(buildReadBox));
  qFuriganaButtons[2].addEventListener('click', () => applyFurigana(buildWriteBox));
  qFuriganaButtons[3].addEventListener('click', () => applyFurigana(buildBracketBox));

  qList.addEventListener('keydown', e => {
    if (questions.length === 0) return;
    if (e.key === 'ArrowDown') {
      e.preventDefault();
      selectedIndex = Math.min(questions.length - 1, selectedIndex + 1);
      highlightSelected();
      qList.children[selectedIndex]?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'ArrowUp') {
      e.preventDefault();
      selectedIndex = Math.max(0, selectedIndex - 1);
      highlightSelected();
      qList.children[selectedIndex]?.scrollIntoView({ block: 'nearest' });
    } else if (e.key === 'Enter') {
      e.preventDefault();
      if (selectedIndex >= 0) loadIntoEditor(questions[selectedIndex]);
    } else if ((e.metaKey || e.ctrlKey) && e.key === 'Backspace') {
      e.preventDefault();
      if (selectedIndex >= 0) {
        editingId = questions[selectedIndex].id;
        deleteCurrent();
      }
    }
  });

  qSaveBtn.addEventListener('click', saveCurrent);
  qDeleteBtn.addEventListener('click', deleteCurrent);
  qNewBtn.addEventListener('click', startNew);
  document.querySelectorAll('input[name="q-weight"]').forEach(r => r.addEventListener('change', drawQuestionPreview));

  refreshQuestionList();
  drawQuestionPreview();

  // ─────────────────────────────────────────────
  // 漢字範囲管理タブ
  // ─────────────────────────────────────────────
  const kGradeSelect = document.getElementById('k-grade');
  const kAdvanceBtn = document.getElementById('k-advance-btn');
  const kGradeLists = document.getElementById('k-grade-lists');

  function renderKanjiTab() {
    const state = loadLearnedKanjiState();
    kGradeSelect.value = String(state.currentGrade);
    const learnedThisGrade = new Set(state.learnedThisGrade);

    kGradeLists.innerHTML = '';
    for (const g of [1, 2, 3, 4, 5, 6]) {
      const block = document.createElement('div');
      block.className = 'k-grade-block';
      const title = document.createElement('div');
      title.className = 'k-grade-title';
      title.textContent = `${g}年生 (${GRADE_KANJI[g].length}字)` +
        (g < state.currentGrade ? ' — すべて既習' : g > state.currentGrade ? ' — まだ先の学年' : ' — 現学年');
      block.appendChild(title);

      const chars = document.createElement('div');
      chars.className = 'k-chars';
      for (const ch of GRADE_KANJI[g]) {
        const el = document.createElement('div');
        el.className = 'k-char';
        el.textContent = ch;
        if (g < state.currentGrade) {
          el.classList.add('locked-past');
        } else if (g > state.currentGrade) {
          el.classList.add('locked-future');
        } else {
          if (learnedThisGrade.has(ch)) el.classList.add('learned');
          el.addEventListener('click', () => {
            if (learnedThisGrade.has(ch)) {
              removeLearnedKanji(ch);
            } else {
              addLearnedKanji([ch]);
            }
            renderKanjiTab();
          });
        }
        chars.appendChild(el);
      }
      block.appendChild(chars);
      kGradeLists.appendChild(block);
    }
  }

  kGradeSelect.addEventListener('change', () => {
    setCurrentGrade(Number(kGradeSelect.value));
    renderKanjiTab();
  });
  kAdvanceBtn.addEventListener('click', () => {
    if (!confirm('学年を1つ進めます。今学年の追加登録した漢字はリセットされます(下位学年としてすべて既習扱いになります)。よろしいですか？')) return;
    advanceGrade();
    renderKanjiTab();
  });

  renderKanjiTab();

  // ─────────────────────────────────────────────
  // テスト生成・印刷タブ
  // ─────────────────────────────────────────────
  const tReviewRatio = document.getElementById('t-review-ratio');
  const tReadRatio = document.getElementById('t-read-ratio');
  const tOkuriganaRatio = document.getElementById('t-okurigana-ratio');
  const tHistoryCount = document.getElementById('t-history-count');
  const tGenerateBtn = document.getElementById('t-generate-btn');
  const tPdfBtn = document.getElementById('t-pdf-btn');
  const tWarnings = document.getElementById('t-warnings');
  const tPreview = document.getElementById('t-preview');
  const tEmpty = document.getElementById('t-empty');
  const tPreviewCtx = tPreview.getContext('2d');

  let currentColumns = null;

  function renderTestControls() {
    const settings = loadSettings();
    tReviewRatio.value = String(settings.reviewRatio);
    tReadRatio.value = String(settings.readRatio);
    tOkuriganaRatio.value = String(settings.okuriganaRatio);
    tHistoryCount.value = String(settings.recentHistoryCount);
  }

  function persistTestSettings() {
    const settings = loadSettings();
    const reviewRatio = Math.min(1, Math.max(0, Number(tReviewRatio.value) || 0));
    const readRatio = Math.min(1, Math.max(0, Number(tReadRatio.value) || 0));
    const okuriganaRatio = Math.min(1, Math.max(0, Number(tOkuriganaRatio.value) || 0));
    const recentHistoryCount = Math.max(1, Math.round(Number(tHistoryCount.value) || 1));
    saveSettings({ ...settings, reviewRatio, readRatio, okuriganaRatio, recentHistoryCount });
  }

  tReviewRatio.addEventListener('change', persistTestSettings);
  tReadRatio.addEventListener('change', persistTestSettings);
  tOkuriganaRatio.addEventListener('change', persistTestSettings);
  tHistoryCount.addEventListener('change', persistTestSettings);

  function showWarnings(warnings) {
    if (warnings.length === 0) {
      tWarnings.style.display = 'none';
      return;
    }
    tWarnings.textContent = warnings.join('\n');
    tWarnings.style.display = 'block';
  }

  function drawTestPreview(columns) {
    const A4_RATIO = 841.89 / 595.28;
    const cssWidth = Math.min(560, Math.max(tPreview.parentElement.clientWidth - 32, 300));
    const cssHeight = cssWidth * A4_RATIO;
    tPreview.style.width = cssWidth + 'px';
    tPreview.style.height = cssHeight + 'px';

    // 画面プレビューは作成者が内容を確認できるよう答えを表示する。印刷用PDFは答えを表示しない(generateTestPdf側)。
    const rendered = renderPageToCanvas(columns, true, FONT_NAME, cssWidth * DPR, cssHeight * DPR);
    tPreview.width = rendered.width;
    tPreview.height = rendered.height;
    tPreviewCtx.drawImage(rendered, 0, 0);
  }

  function generate() {
    persistTestSettings();
    const settings = loadSettings();
    const learnedState = loadLearnedKanjiState();
    const learnedSet = computeLearnedKanjiSet(learnedState);
    const allQuestions = listQuestions();
    const recentUses = countRecentUses(settings.recentHistoryCount);

    const { selected, warnings } = selectQuestions(
      allQuestions, learnedSet, learnedState.currentGrade, recentUses, settings,
    );
    showWarnings(warnings);

    if (selected.length === 0) {
      currentColumns = null;
      tPdfBtn.disabled = true;
      tPreview.style.display = 'none';
      tEmpty.style.display = 'block';
      return;
    }

    // 列の高さ計測用に、プレビューと同じフォントで測る(相対比較のみに使うため解像度は問わない)
    const measureCanvas = document.createElement('canvas');
    const measureCtx = measureCanvas.getContext('2d');
    const measureTategaki = new Tategaki(measureCtx, { font: `32px "${FONT_NAME}"`, lineHeight: 1.0 });
    const measureHeight = text => measureTategaki.measureText(text).height;

    const { columns } = assignColumns(selected, measureHeight, settings.slotsPerColumn);
    currentColumns = columns;

    tEmpty.style.display = 'none';
    tPreview.style.display = 'block';
    drawTestPreview(columns);
    tPdfBtn.disabled = false;
  }

  /**
   * 列レイアウトをPDF化して新しいタブで開き、履歴に記録する。
   * テスト生成タブの初回出力・履歴確認タブからの再印刷の両方から使う共通処理。
   */
  async function exportColumnsAsPdf(columns) {
    const ids = columns.flat().map(q => q.id);
    const entry = recordTest(ids);
    const label = formatTestLabel(entry.date);
    const bytes = await generateTestPdf(columns, FONT_NAME, label);
    openPdfInNewTab(bytes);
  }

  async function exportPdf() {
    if (!currentColumns) return;
    tPdfBtn.disabled = true;
    tPdfBtn.textContent = '生成中…';
    try {
      await exportColumnsAsPdf(currentColumns);
    } catch (e) {
      alert('PDFの生成に失敗しました: ' + e);
    } finally {
      tPdfBtn.disabled = false;
      tPdfBtn.textContent = 'PDFを開く(印刷用)';
    }
  }

  tGenerateBtn.addEventListener('click', generate);
  tPdfBtn.addEventListener('click', exportPdf);
  new ResizeObserver(() => { if (currentColumns) drawTestPreview(currentColumns); }).observe(tPreview.parentElement);

  renderTestControls();

  // ─────────────────────────────────────────────
  // 履歴確認タブ
  // ─────────────────────────────────────────────
  const hList = document.getElementById('h-list');
  const hCount = document.getElementById('h-count');
  const hWarnings = document.getElementById('h-warnings');
  const hEmpty = document.getElementById('h-empty');
  const hPreviewWrap = document.getElementById('h-preview-wrap');
  const hPreview = document.getElementById('h-preview');
  const hPreviewCtx = hPreview.getContext('2d');
  const hDetailControls = document.getElementById('h-detail-controls');
  const hReprintBtn = document.getElementById('h-reprint-btn');

  let selectedHistoryEntry = null;
  let selectedHistoryColumns = null; // 再印刷ボタン用に、直近描画した列レイアウトを保持する

  function clearHistoryDetail() {
    selectedHistoryEntry = null;
    selectedHistoryColumns = null;
    showHistoryWarnings([]);
    hDetailControls.style.display = 'none';
    hPreviewWrap.style.display = 'none';
    hEmpty.textContent = '左の一覧からテストを選ぶと、解答（赤字）がここに表示されます。';
    hEmpty.style.display = 'block';
  }

  function renderHistoryList() {
    const history = [...loadHistory()].reverse(); // 新しい順
    hCount.textContent = String(history.length);
    hList.innerHTML = '';
    if (history.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'h-empty';
      empty.textContent = 'まだテストを生成していません。';
      hList.appendChild(empty);
      clearHistoryDetail();
      return;
    }
    history.forEach(entry => {
      const li = document.createElement('li');
      const label = document.createElement('span');
      label.className = 'h-label';
      label.textContent = formatTestLabel(entry.date);
      const count = document.createElement('span');
      count.className = 'h-count';
      count.textContent = `${entry.questionIds.length}問`;
      label.appendChild(count);
      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'btn btn-danger h-delete-btn';
      deleteBtn.textContent = '削除';
      deleteBtn.addEventListener('click', ev => {
        ev.stopPropagation();
        if (!confirm(`${formatTestLabel(entry.date)}の履歴を削除しますか？`)) return;
        deleteHistoryEntry(entry.date);
        if (selectedHistoryEntry && selectedHistoryEntry.date === entry.date) clearHistoryDetail();
        renderHistoryList();
      });
      li.appendChild(label);
      li.appendChild(deleteBtn);
      if (selectedHistoryEntry && selectedHistoryEntry.date === entry.date) li.classList.add('selected');
      li.addEventListener('click', () => {
        [...hList.children].forEach(c => c.classList.remove('selected'));
        li.classList.add('selected');
        selectedHistoryEntry = entry;
        drawHistoryDetail(entry);
      });
      hList.appendChild(li);
    });
  }

  function showHistoryWarnings(warnings) {
    if (warnings.length === 0) {
      hWarnings.style.display = 'none';
      return;
    }
    hWarnings.textContent = warnings.join('\n');
    hWarnings.style.display = 'block';
  }

  function drawHistoryDetail(entry) {
    const found = [];
    let missingCount = 0;
    for (const id of entry.questionIds) {
      const q = getQuestion(id);
      if (q) found.push(q);
      else missingCount++;
    }
    const warnings = missingCount > 0
      ? [`${missingCount}問は削除済みのため表示できません。`]
      : [];
    showHistoryWarnings(warnings);

    if (found.length === 0) {
      hEmpty.textContent = 'この回の問題はすべて削除されているため表示できません。';
      hEmpty.style.display = 'block';
      hPreviewWrap.style.display = 'none';
      hDetailControls.style.display = 'none';
      selectedHistoryColumns = null;
      return;
    }

    const settings = loadSettings();
    const measureCanvas = document.createElement('canvas');
    const measureCtx = measureCanvas.getContext('2d');
    const measureTategaki = new Tategaki(measureCtx, { font: `32px "${FONT_NAME}"`, lineHeight: 1.0 });
    const measureHeight = text => measureTategaki.measureText(text).height;
    const { columns } = assignColumns(found, measureHeight, settings.slotsPerColumn);
    selectedHistoryColumns = columns;

    hEmpty.style.display = 'none';
    hPreviewWrap.style.display = 'flex';
    hDetailControls.style.display = 'block';

    const A4_RATIO = 841.89 / 595.28;
    const cssWidth = Math.min(560, Math.max(hPreviewWrap.clientWidth - 32, 300));
    const cssHeight = cssWidth * A4_RATIO;
    hPreview.style.width = cssWidth + 'px';
    hPreview.style.height = cssHeight + 'px';

    const rendered = renderPageToCanvas(columns, true, FONT_NAME, cssWidth * DPR, cssHeight * DPR);
    hPreview.width = rendered.width;
    hPreview.height = rendered.height;
    hPreviewCtx.drawImage(rendered, 0, 0);
  }

  new ResizeObserver(() => { if (selectedHistoryEntry) drawHistoryDetail(selectedHistoryEntry); }).observe(hPreviewWrap);

  hReprintBtn.addEventListener('click', async () => {
    if (!selectedHistoryColumns) return;
    hReprintBtn.disabled = true;
    hReprintBtn.textContent = '生成中…';
    try {
      await exportColumnsAsPdf(selectedHistoryColumns);
      renderHistoryList();
    } catch (e) {
      alert('PDFの生成に失敗しました: ' + e);
    } finally {
      hReprintBtn.disabled = false;
      hReprintBtn.textContent = 'この回をもう一度印刷する';
    }
  });
</script>
</body>
</html>
